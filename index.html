<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boas-vindas | NoCode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: #1f2937;
    }

    .card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .emoji { font-size: 56px; margin-bottom: 16px; }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #4f46e5;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #4b5563;
    }

    p + p { margin-top: 12px; }

    .assinatura {
      margin-top: 32px;
      font-weight: 600;
      color: #9333ea;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>Seja bem-vindo(a) à NoCode!</h1>
    <p>Estamos muito felizes em ter você com a gente.</p>
    <p>Aqui você vai aprender a criar suas próprias soluções sem precisar escrever código. Vamos juntos nessa jornada!</p>
    <p class="assinatura">Equipe NoCode 💜</p>
  </main>
</body>
</html>
